<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>힘의 합성과 분해 문제 풀기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #efeae4;
  --grid: rgba(110, 70, 20, 0.06);
  --card: #fdfbf8;
  --ink: #2b2420;
  --muted: #776c62;
  --line: #d8cfc3;
  --accent: #a4542a;
  --accent-ink: #ffffff;
  --ok: #24704a;
  --ok-bg: #e2f3ea;
  --bad: #a83a28;
  --bad-bg: #fbe9e5;
  --step-bg: #f4efe8;
  --overlay: rgba(30, 24, 18, 0.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1511; --grid: rgba(210, 160, 110, 0.07); --card: #241d18; --ink: #efe7dd;
    --muted: #b1a492; --line: #3b3127; --accent: #e0905b; --accent-ink: #231407;
    --ok: #6fd3a0; --ok-bg: #173226; --bad: #ff9c88; --bad-bg: #3a1f19; --step-bg: #2b2319; --overlay: rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1511; --grid: rgba(210, 160, 110, 0.07); --card: #241d18; --ink: #efe7dd;
  --muted: #b1a492; --line: #3b3127; --accent: #e0905b; --accent-ink: #231407;
  --ok: #6fd3a0; --ok-bg: #173226; --bad: #ff9c88; --bad-bg: #3a1f19; --step-bg: #2b2319; --overlay: rgba(0,0,0,0.6);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.6;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.score { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.score b { color: var(--ink); }
.quest { background: var(--card); border: 1.5px solid var(--ink); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 3px 3px 0 var(--accent); }
.quest-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.quest-stage { font-size: 0.82rem; font-weight: 700; color: var(--accent); }
.dots { display: flex; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.3px solid var(--accent); background: transparent; }
.dot.cleared { background: var(--accent); }
.dot.active { outline: 2px solid var(--accent); outline-offset: 2px; }
.quest-story { font-size: 0.92rem; margin: 0; word-break: keep-all; }
.win-icon { display: block; margin: 4px auto 10px; }
.win-title { text-align: center; font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }
.win-text { text-align: center; color: var(--muted); margin: 0 0 4px; word-break: keep-all; }
.opening-emoji { display: block; text-align: center; font-size: 3rem; margin: 4px 0 10px; }
.opening-title { text-align: center; font-size: 1.25rem; font-weight: 700; margin: 0 0 10px; word-break: keep-all; }
.opening-text { color: var(--muted); margin: 0 0 8px; word-break: keep-all; }
.card {
  background: var(--card);
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  padding: 18px 18px 20px;
  box-shadow: 4px 4px 0 var(--accent);
}
.tag { display: inline-block; font-size: 0.82rem; font-weight: 500; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 10px; margin-bottom: 10px; }
.q { font-size: 1.08rem; margin: 0 0 4px; word-break: keep-all; }
.given { font-size: 0.88rem; color: var(--muted); margin: 0 0 12px; word-break: keep-all; }
.diagram { display: block; margin: 8px auto 14px; width: 100%; max-width: 250px; height: auto; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.row input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; padding: 10px 12px;
  border: 1.5px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink);
}
.row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.unit { min-width: 3.2em; color: var(--muted); font-size: 1rem; }
.btns { display: flex; gap: 10px; }
button {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 6px; padding: 11px 16px; flex: 1;
  border: 1.5px solid var(--ink); background: var(--card); color: var(--ink);
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }
.hint { font-size: 0.82rem; color: var(--muted); margin: 14px 2px 0; }

.overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay.open { display: flex; }
.modal {
  background: var(--card); border: 1.5px solid var(--ink); border-radius: 8px; width: 100%; max-width: 480px;
  max-height: 88vh; overflow-y: auto; padding: 20px;
  animation: pop 0.16s ease-out;
}
@keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
.verdict { display: flex; align-items: center; gap: 10px; border-radius: 6px; padding: 10px 14px; font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--bad-bg); color: var(--bad); }
.verdict svg { flex: none; }
.modal p { margin: 6px 0; word-break: keep-all; }
.answer-line { font-size: 1.02rem; }
.steps { background: var(--step-bg); border-radius: 6px; padding: 12px 14px; margin: 12px 0 4px; font-size: 0.95rem; }
.steps h3 { margin: 0 0 6px; font-size: 0.95rem; }
.steps ol { margin: 0; padding-left: 1.2em; }
.steps li { margin: 4px 0; word-break: keep-all; }
.modal .btns { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>⚔️ 벡터 왕국 구출 퀘스트</h1>
    <div class="score">맞힘 <b id="right">0</b> / <b id="tried">0</b></div>
  </header>

  <section class="card" id="opening">
    <span class="opening-emoji">🏰</span>
    <p class="opening-title">벡터 왕국이 위험에 빠졌어요!</p>
    <p class="opening-text">힘의 균형이 깨지면서 다리가 무너지고, 성벽이 흔들리고 있어요. 흩어진 힘을 다시 하나로 모을 수 있는 건 왕국에서 오직 당신뿐이에요.</p>
    <p class="opening-text">세 개의 관문을 통과해 힘을 모으고, 왕국을 구하러 가야 해요!</p>
    <div class="btns"><button type="button" class="primary" id="startBtn">⚔️ 왕국을 구하러 가기</button></div>
  </section>

  <div id="questArea" style="display:none">
    <div class="quest">
      <div class="quest-top">
        <span class="quest-stage" id="stageLabel"></span>
        <div class="dots" id="dots"></div>
      </div>
      <p class="quest-story" id="story"></p>
    </div>

    <section class="card" aria-live="polite">
      <span class="tag" id="tag"></span>
      <p class="q" id="question"></p>
      <p class="given" id="given"></p>
      <svg class="diagram" id="diagram" viewBox="0 0 250 210" role="img" aria-label="벡터 그림"></svg>
      <div class="row">
        <input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="답 입력" aria-label="답">
        <span class="unit" id="unit"></span>
      </div>
      <div class="btns">
        <button id="newBtn" type="button">처음부터</button>
        <button id="checkBtn" type="button" class="primary">확인</button>
      </div>
    </section>
    <p class="hint">소수는 둘째 자리까지 나오는 값으로 입력하세요. 오차 1% 이내면 정답으로 처리해요.</p>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="verdictText">
  <div class="modal" id="modal"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var current = null, tried = 0, right = 0;

  function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pick(arr) { return arr[ri(0, arr.length - 1)]; }
  function round(x, d) { var p = Math.pow(10, d); return Math.round(x * p) / p; }
  function f(x) { return String(round(x, 3)); }
  function isClean(x, d) { return Math.abs(x - round(x, d)) < 1e-9; }

  // 특수각 사인/코사인 표 (교과서에서 자주 쓰는 근삿값)
  var TRIG = {
    30: { sin: 0.5, cos: 0.87 },
    37: { sin: 0.6, cos: 0.8 },
    45: { sin: 0.71, cos: 0.71 },
    53: { sin: 0.8, cos: 0.6 },
    60: { sin: 0.87, cos: 0.5 }
  };
  var ANGLES = [30, 37, 53, 60];

  // 문제 유형 ------------------------------------------------------
  var makers = [

    function perpAddition() {
      var A, B, R;
      do { A = pick([3, 4, 6, 8, 9, 12]); B = pick([3, 4, 6, 8, 9, 12]); R = Math.sqrt(A * A + B * B); } while (!isClean(R, 2));
      return {
        tag: "벡터의 덧셈",
        q: "두 힘을 합성한 합력의 크기는 몇 N일까요?",
        given: "서로 수직인 두 힘, A = " + A + " N, B = " + B + " N",
        unit: "N", ans: round(R, 2),
        dia: { kind: "perp", A: A, B: B },
        steps: [
          "두 벡터가 서로 수직이면 합력의 크기는 피타고라스 정리로 구해요.",
          "R = √(A² + B²)",
          "R = √(" + A + "² + " + B + "²) = √" + (A * A + B * B) + " = " + f(R) + " N"
        ]
      };
    },

    function inclineParallel() {
      var m = pick([1, 2, 4, 5]), g = 10, ang = pick(ANGLES);
      var mg = m * g, Fx = round(mg * TRIG[ang].sin, 1);
      return {
        tag: "벡터의 분해 · 경사면",
        q: "중력을 빗면에 나란한 방향과 수직인 방향으로 분해할 때, 빗면에 나란한 방향 성분의 크기는 몇 N일까요?",
        given: "질량 m = " + m + " kg, 중력가속도 g = " + g + " m/s², 경사각 θ = " + ang + "°",
        unit: "N", ans: Fx,
        dia: { kind: "incline", ang: ang, comp: "x" },
        steps: [
          "중력의 크기는 mg = " + m + " × " + g + " = " + mg + " N",
          "빗면에 나란한 성분은 mg sinθ 예요. (θ = " + ang + "°, sin" + ang + "° ≈ " + TRIG[ang].sin + ")",
          "mg sinθ = " + mg + " × " + TRIG[ang].sin + " = " + f(Fx) + " N"
        ]
      };
    },

    function generalAngleAddition() {
      var A, B, ang, R;
      ang = pick([60]);
      do { A = pick([3, 4, 6, 8]); B = pick([3, 4, 6, 8]); R = Math.sqrt(A * A + B * B + 2 * A * B * TRIG[ang].cos); } while (!isClean(R, 1) === false && false);
      R = Math.sqrt(A * A + B * B + 2 * A * B * TRIG[60].cos);
      return {
        tag: "벡터의 덧셈",
        q: "두 힘 사이의 각이 60°일 때, 합력의 크기는 몇 N일까요? (코사인법칙 이용, 소수 둘째 자리까지)",
        given: "두 힘 A = " + A + " N, B = " + B + " N, 두 힘이 이루는 각 = 60°",
        unit: "N", ans: round(R, 2),
        dia: { kind: "angle", A: A, B: B, ang: 60 },
        steps: [
          "두 벡터 사이의 각이 θ일 때 합력의 크기는 코사인법칙으로 구해요.",
          "R = √(A² + B² + 2AB cosθ)",
          "R = √(" + A + "² + " + B + "² + 2×" + A + "×" + B + "×" + TRIG[60].cos + ") = " + f(R) + " N"
        ]
      };
    }
  ];

  // 그림 ------------------------------------------------------------
  function arrow(x1, y1, x2, y2, color, label, lx, ly) {
    var s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="2.2"/>';
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var hx1 = x2 - 9 * Math.cos(ang - 0.4), hy1 = y2 - 9 * Math.sin(ang - 0.4);
    var hx2 = x2 - 9 * Math.cos(ang + 0.4), hy2 = y2 - 9 * Math.sin(ang + 0.4);
    s += '<path d="M' + x2 + ' ' + y2 + ' L' + hx1 + ' ' + hy1 + ' L' + hx2 + ' ' + hy2 + ' Z" fill="' + color + '"/>';
    if (label) s += '<text x="' + lx + '" y="' + ly + '" font-size="12" font-style="italic" fill="' + color + '">' + label + '</text>';
    return s;
  }

  function drawDiagram(d) {
    var cx = 125, cy = 160, s = '';
    var accent = "#a4542a", red = "#a83a28", ink = "currentColor";
    if (d.kind === "perp") {
      s += arrow(cx, cy, cx, cy - 70, accent, "A", cx - 18, cy - 60);
      s += arrow(cx, cy, cx + 80, cy, red, "B", cx + 60, cy + 16);
      s += '<path d="M' + (cx + 10) + ' ' + cy + ' L' + (cx + 10) + ' ' + (cy - 10) + ' L' + cx + ' ' + (cy - 10) + '" fill="none" stroke="currentColor" stroke-width="1"/>';
    } else if (d.kind === "collinear") {
      if (d.same) {
        s += arrow(40, cy - 20, 40 + d.A * 14, cy - 20, accent, "A", 40, cy - 28);
        s += arrow(40, cy + 20, 40 + d.B * 14, cy + 20, red, "B", 40, cy + 36);
      } else {
        s += arrow(60, cy - 20, 60 + d.A * 14, cy - 20, accent, "A", 60, cy - 28);
        s += arrow(60 + d.A * 14, cy + 20, 60 + d.A * 14 - d.B * 14, cy + 20, red, "B", 60 + d.A * 14 - 16, cy + 36);
      }
    } else if (d.kind === "scalar") {
      s += arrow(60, cy, 60 + d.A * 14, cy, accent, "A", 60, cy - 10);
      s += arrow(60, cy + 40, 60 + d.A * d.k * 7, cy + 40, red, "kA", 60, cy + 56);
    } else if (d.kind === "incline") {
      var baseX = 30, baseY = 185, L = 170;
      var th = d.ang * Math.PI / 180;
      var topX = baseX + L * Math.cos(th), topY = baseY - L * Math.sin(th);
      s += '<line x1="' + baseX + '" y1="' + baseY + '" x2="' + topX + '" y2="' + topY + '" stroke="currentColor" stroke-width="2"/>';
      s += '<line x1="' + baseX + '" y1="' + baseY + '" x2="' + (baseX + L) + '" y2="' + baseY + '" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>';
      var bx = baseX + 85 * Math.cos(th), by = baseY - 85 * Math.sin(th);
      s += '<rect x="' + (bx - 14) + '" y="' + (by - 10) + '" width="26" height="20" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(' + (-d.ang) + ' ' + bx + ' ' + by + ')"/>';
      s += arrow(bx, by, bx, by + 60, "currentColor", "mg", bx + 8, by + 50);
      if (d.comp === "x") {
        var ex = bx + 60 * Math.sin(th), ey = by + 60 * Math.cos(th);
        s += arrow(bx, by, ex, ey, accent, "", 0, 0);
        s += '<text x="' + (ex + 6) + '" y="' + (ey) + '" font-size="12" font-style="italic" fill="' + accent + '">mg sinθ</text>';
      } else {
        var fx = bx - 60 * Math.cos(th), fy = by - 60 * Math.sin(th);
        s += arrow(bx, by, fx, fy, red, "", 0, 0);
        s += '<text x="' + (fx - 10) + '" y="' + (fy - 6) + '" font-size="12" font-style="italic" text-anchor="end" fill="' + red + '">mg cosθ</text>';
      }
      s += '<text x="' + (baseX + 24) + '" y="' + (baseY - 6) + '" font-size="12" fill="currentColor">θ</text>';
    } else if (d.kind === "angle") {
      var a1 = -0.9, a2 = -0.9 + (d.ang * Math.PI / 180);
      var ax = cx + 85 * Math.cos(a1), ay = cy + 85 * Math.sin(a1);
      var bx2 = cx + 85 * Math.cos(a2), by2 = cy + 85 * Math.sin(a2);
      s += arrow(cx, cy, ax, ay, accent, "A", ax + 6, ay);
      s += arrow(cx, cy, bx2, by2, red, "B", bx2 + 6, by2 - 4);
      s += '<text x="' + (cx + 20) + '" y="' + (cy - 6) + '" font-size="12" fill="currentColor">' + d.ang + '°</text>';
    }
    $("diagram").innerHTML = s;
  }

  // 흐름 ------------------------------------------------------------
  var typeNames = [
    "벡터의 덧셈 (수직)", "벡터의 분해 · 빗면 나란한 성분", "벡터의 덧셈 (60° 코사인법칙)"
  ];
  var stageTitles = [
    "1관문 · 교차로의 다리", "2관문 · 미끄러운 성벽", "최종관문 · 두 기사의 합공"
  ];
  var stories = [
    "두 힘이 직각으로 만나는 다리가 무너지기 직전이에요. 합력의 크기를 구해 다리를 버티게 하세요!",
    "미끄러운 성벽 경사로예요. 중력 중 '미끄러지려는' 성분을 구해야 수레가 멈추지 않아요.",
    "최종 관문! 두 기사가 60° 각도로 동시에 공격해요. 코사인법칙으로 합쳐진 힘을 구해 왕국을 구하세요."
  ];
  var cleared = [false, false, false];

  function renderQuest(i) {
    $("stageLabel").textContent = stageTitles[i];
    $("story").textContent = stories[i];
    var h = "";
    for (var k = 0; k < stories.length; k++) {
      h += '<span class="dot' + (cleared[k] ? ' cleared' : '') + (k === i ? ' active' : '') + '"></span>';
    }
    $("dots").innerHTML = h;
  }
  var currentStage = 0;

  function restartQuest() {
    currentStage = 0;
    cleared = [false, false, false];
    tried = 0; right = 0;
    $("tried").textContent = 0; $("right").textContent = 0;
    newProblem();
  }

  var lastKey = "";
  function newProblem() {
    var i = currentStage;
    var key;
    for (var tries = 0; tries < 20; tries++) {
      current = makers[i]();
      key = current.given;
      if (key !== lastKey) break;
    }
    lastKey = key;
    renderQuest(i);
    $("tag").textContent = current.tag;
    $("question").textContent = current.q;
    $("given").textContent = current.given;
    $("unit").textContent = current.unit;
    $("answer").value = "";
    drawDiagram(current.dia || {});
    closeModal();
    $("answer").focus({ preventScroll: true });
  }

  function parseNum(s) {
    s = String(s).trim().replace(/,/g, "").replace(/\s+/g, "");
    if (!s || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }

  function checkAnswer() {
    var raw = $("answer").value;
    var val = parseNum(raw);
    if (isNaN(val)) {
      $("answer").focus();
      $("answer").style.borderColor = "var(--bad)";
      setTimeout(function () { $("answer").style.borderColor = ""; }, 900);
      return;
    }
    var tol = Math.max(0.05, Math.abs(current.ans) * 0.01);
    var ok = Math.abs(val - current.ans) <= tol;
    tried++; if (ok) right++;
    $("tried").textContent = tried; $("right").textContent = right;
    var stageIdx = currentStage;
    if (ok) { cleared[stageIdx] = true; renderQuest(stageIdx); }
    showModal(ok, val, stageIdx);
  }

  var iconOk = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
  var iconBad = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';

  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  var winIcon = '<svg class="win-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#c99a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5"/></svg>';

  function showModal(ok, val, stageIdx) {
    var h = '';
    var isLast = stageIdx === stories.length - 1;

    if (ok && isLast) {
      // 최종 승리 화면
      h += winIcon;
      h += '<p class="win-title">🏆 왕국 구출 완료!</p>';
      h += '<p class="win-text">세 관문을 모두 돌파했어요. 벡터 왕국이 평화를 되찾았습니다!</p>';
      h += '<p class="win-text">정답 ' + right + ' / 시도 ' + tried + '</p>';
      h += '<div class="btns"><button type="button" class="primary" id="restartBtn2">다시 모험 떠나기</button></div>';
      $("modal").innerHTML = h;
      $("overlay").classList.add("open");
      $("restartBtn2").addEventListener("click", function () { closeModal(); restartQuest(); });
      $("restartBtn2").focus();
      return;
    }

    if (ok) {
      h += '<div class="verdict ok">' + iconOk + '<span id="verdictText">정답이에요!</span></div>';
      h += '<p class="answer-line">답: <b>' + f(current.ans) + ' ' + esc(current.unit) + '</b></p>';
      h += '<div class="steps"><h3>관문 돌파!</h3><p>' + stageTitles[stageIdx] + ' 통과! 다음 관문으로 향해 보세요.</p></div>';
      h += '<div class="btns"><button type="button" class="primary" id="nextBtn">다음 문제</button></div>';
      $("modal").innerHTML = h;
      $("overlay").classList.add("open");
      $("nextBtn").addEventListener("click", function () { currentStage++; newProblem(); });
      $("nextBtn").focus();
      return;
    }

    // 오답
    h += '<div class="verdict bad">' + iconBad + '<span id="verdictText">오답이에요</span></div>';
    h += '<p class="answer-line">내가 쓴 답: ' + esc(f(val)) + ' ' + esc(current.unit) + '</p>';
    h += '<p class="answer-line">정답: <b>' + f(current.ans) + ' ' + esc(current.unit) + '</b></p>';
    h += '<div class="steps"><h3>풀이</h3><ol>';
    for (var i = 0; i < current.steps.length; i++) h += '<li>' + esc(current.steps[i]) + '</li>';
    h += '</ol></div>';
    h += '<div class="btns"><button type="button" class="primary" id="retryBtn">다시 풀기</button></div>';
    $("modal").innerHTML = h;
    $("overlay").classList.add("open");
    $("retryBtn").addEventListener("click", function () { closeModal(); $("answer").focus(); $("answer").select(); });
    $("retryBtn").focus();
  }

  function closeModal() { $("overlay").classList.remove("open"); }

  $("newBtn").addEventListener("click", restartQuest);
  $("checkBtn").addEventListener("click", checkAnswer);
  $("answer").addEventListener("keydown", function (e) { if (e.key === "Enter") checkAnswer(); });
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  $("startBtn").addEventListener("click", function () {
    $("opening").style.display = "none";
    $("questArea").style.display = "";
    renderQuest(0);
    newProblem();
  });
})();
</script>
</body>
</html>
