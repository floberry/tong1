<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8EDF2">
<title>물리 8번 유형 연습 - 막대의 평형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8EDF2; --paper:#FFFFFF; --ink:#16212B; --muted:#56667A;
    --line:#CBD5E0; --grid:#E4EAF1;
    --accent:#1F4FD8; --accent-soft:#E6ECFD; --on-accent:#FFFFFF;
    --ok:#0F7A4A; --ok-soft:#E3F4EB;
    --bad:#B4321F; --bad-soft:#FBE9E6;
    --rod-a:#F4F7FA; --rod-b:#BAC6D2; --rod-c:#8D9CAC; --rod-stroke:#6C7C8D;
    --block:#22303E; --block-ink:#FFFFFF;
    --serif:'Noto Serif KR','Batang','AppleMyungjo',serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F161D; --paper:#18222C; --ink:#E7EDF3; --muted:#9AAABB;
      --line:#2E3C4A; --grid:#1F2B37;
      --accent:#86A9FF; --accent-soft:#1C2A4A; --on-accent:#0B1424;
      --ok:#4CC98A; --ok-soft:#12291F;
      --bad:#FF8A78; --bad-soft:#341A17;
      --rod-a:#71818F; --rod-b:#4C5A68; --rod-c:#2F3B47; --rod-stroke:#93A3B3;
      --block:#D5DEE8; --block-ink:#0F161D;
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.6;
  }
  .app{
    max-width:480px; margin:0 auto; padding:0 14px;
    padding-top:env(safe-area-inset-top,0px);
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  }
  .app > main{flex:1}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 2px 12px;
  }
  h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em}
  .score{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .score b{color:var(--ink); font-weight:700}

  .card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:16px;
  }

  .qhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px}
  .qno{font:600 30px/1 var(--serif); letter-spacing:.01em}
  .pts{font:400 13px var(--serif); color:var(--muted)}
  .stem{margin:0; font:400 16px/1.85 var(--serif); word-break:keep-all}
  .stem strong{font-weight:600}
  .ask{margin:8px 0 0; font:600 16px var(--serif)}
  i.v{font-family:var(--serif); font-style:italic}

  .fig{
    margin-top:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:20px 20px;
  }
  .fig svg{display:block; width:100%; height:auto}

  /* SVG parts */
  .ceil{stroke:var(--ink); stroke-width:2.5}
  .hatch-l{stroke:var(--muted); stroke-width:1.4}
  .cord{stroke:var(--ink); stroke-width:1.8}
  .rod{stroke:var(--rod-stroke); stroke-width:1.5}
  .cap{fill:var(--rod-a); stroke:var(--rod-stroke); stroke-width:1.2}
  .knot{fill:var(--ink)}
  .blk{fill:var(--block)}
  .blk-t{fill:var(--block-ink); font:700 17px var(--sans)}
  .wl{fill:var(--ink); font:italic 400 22px var(--serif)}
  .dimg line{stroke:var(--ink); stroke-width:1.3}
  .dimg text{fill:var(--ink); stroke:none; font:italic 400 17px var(--serif)}
  .acc line{stroke:var(--accent)}
  .acc text{fill:var(--accent)}
  .guide{stroke:var(--accent); stroke-width:1.2; stroke-dasharray:4 4}
  .sol .wtxt{fill:var(--accent); font:italic 400 20px var(--serif)}
  .sol .wtxt tspan{font:500 12px var(--sans); font-style:normal}
  .sol .dot{fill:var(--paper); stroke:var(--accent); stroke-width:2}
  .sol .arrow{stroke:var(--accent); stroke-width:2.2}
  .sol{opacity:0; transition:opacity .4s ease}
  .solved .sol{opacity:1}

  .opts{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:8px}
  .opt{
    appearance:none; -webkit-appearance:none; width:100%; min-height:50px;
    display:flex; align-items:center; gap:12px; padding:0 14px;
    background:var(--paper); color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px;
    font:500 17px var(--sans); text-align:left; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .opt .no{font:600 20px var(--serif); width:26px; text-align:center}
  .opt .val{flex:1; font-variant-numeric:tabular-nums}
  .opt .mark{font-weight:700; width:1.2em; text-align:center}
  .opt[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok); background:var(--ok-soft)}
  .opt.ok .mark::after{content:'✓'; color:var(--ok)}
  .opt.bad{border-color:var(--bad); background:var(--bad-soft)}
  .opt.bad .mark::after{content:'✕'; color:var(--bad)}
  .opt:disabled{cursor:default}
  .opt:disabled:not(.ok):not(.bad){opacity:.5}

  .result{margin-top:12px; scroll-margin-bottom:110px; word-break:keep-all}
  .result.ok{background:var(--ok-soft); border-color:var(--ok)}
  .result.bad{background:var(--bad-soft); border-color:var(--bad)}
  .result h2{margin:0 0 6px; font-size:17px; font-weight:700}
  .result.ok h2{color:var(--ok)}
  .result.bad h2{color:var(--bad)}
  .result p{margin:0 0 8px; font-size:15px}
  .result .why{font-weight:500}
  .result ol{margin:8px 0 0; padding-left:22px; font-size:15px; line-height:1.75}
  .result li{margin:0 0 8px; padding-left:2px}
  .result li:last-child{margin-bottom:0}
  .result .eq{font-variant-numeric:tabular-nums}
  .result .note{margin:12px 0 0; font-size:13px; color:var(--muted)}

  .bar{
    position:sticky; bottom:0; z-index:5;
    display:grid; grid-template-columns:1fr 1.5fr; gap:10px;
    margin:0 -14px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .btn{
    appearance:none; -webkit-appearance:none; height:52px; border-radius:12px;
    font:700 16px var(--sans); cursor:pointer; -webkit-tap-highlight-color:transparent;
    border:2px solid var(--accent); background:var(--paper); color:var(--accent);
  }
  .btn.solid{background:var(--accent); color:var(--on-accent)}
  .btn:disabled{opacity:.4; cursor:default}
  .btn:active:not(:disabled), .opt:active:not(:disabled){transform:scale(.985)}

  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    .sol{transition:none}
    .btn:active:not(:disabled), .opt:active:not(:disabled){transform:none}
  }
  /* 문제 전 인트로 화면 */
  .intro{
    position:fixed; inset:0; z-index:50; background:#0A0E13;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px));
    opacity:0; visibility:hidden; cursor:pointer;
    transition:opacity .45s ease, visibility 0s linear .45s;
    -webkit-tap-highlight-color:transparent;
  }
  .intro.on{opacity:1; visibility:visible; transition:opacity .25s ease}
  .intro img{
    display:block; width:min(100%,480px); height:auto;
    border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .intro .skip{margin:0; font-size:13px; color:#8E9BAA}
  @media (prefers-reduced-motion:reduce){ .intro, .intro.on{transition:none} }
  /* 오답 시 '빵빵빵' 도장 효과 */
  .skullLayer{
    position:fixed; inset:0; z-index:58; pointer-events:none;
    transition:opacity .6s ease;
  }
  .skullLayer.fade{opacity:0}
  .skullStamp{
    position:absolute; width:110px; height:auto;
    transform:translate(-50%,-50%) scale(0) rotate(var(--rot,0deg));
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
    animation:stampPop .46s cubic-bezier(.17,.89,.32,1.49) both;
  }
  @keyframes stampPop{
    0%{transform:translate(-50%,-50%) scale(2.8) rotate(var(--rot,0deg)); opacity:0}
    50%{opacity:1}
    65%{transform:translate(-50%,-50%) scale(.8) rotate(var(--rot,0deg)); opacity:1}
    82%{transform:translate(-50%,-50%) scale(1.12) rotate(var(--rot,0deg))}
    100%{transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg)); opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    .skullStamp{animation:none; transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg)); opacity:1}
  }
  [hidden]{display:none !important}
</style>
<noscript><style>.intro{display:none}</style></noscript>
</head>
<body>
<div class="app">
  <header>
    <h1>막대의 평형 연습</h1>
    <div class="score" aria-live="polite">맞힌 문제 <b id="score">0</b> / <span id="tries">0</span></div>
  </header>

  <main>
    <section class="card" aria-labelledby="q-title">
      <div class="qhead">
        <span class="qno" id="q-title">08</span>
        <span class="pts">[2점]</span>
      </div>
      <p class="stem" id="stem"></p>
      <p class="ask"><i class="v">W</i>는?</p>

      <div class="fig" id="fig"></div>

      <ul class="opts" id="opts" role="radiogroup" aria-label="보기"></ul>
    </section>

    <section class="card result" id="result" aria-live="polite" hidden></section>
  </main>

  <div class="bar">
    <button class="btn" id="btn-new" type="button">새 문제</button>
    <button class="btn solid" id="btn-check" type="button" disabled>확인</button>
  </div>
</div>

      while (tries < 8 && usedRects.some(r => Math.hypot(r.l - left, r.t - top) < 26));
      usedRects.push({ l: left, t: top });
      img.style.setProperty('--rot', rot + 'deg');
      img.style.width = size + 'px';
      img.style.left = left + '%';
      img.style.top = top + '%';
      img.style.animationDelay = reduceMotion ? '0s' : (i * 0.22) + 's';
      layer.appendChild(img);
    }
    const popEnd = reduceMotion ? 0 : (n - 1) * 220 + 480;
    const t1 = setTimeout(() => layer.classList.add('fade'), popEnd + 700);
    const t2 = setTimeout(() => layer.remove(), popEnd + 700 + 650);
    layer._timers = [t1, t2];
  }

  const state = { p: null, opts: [], sel: null, done: false, score: 0, tries: 0, lastKey: '' };

  /* ---------- 문제 생성 ----------
     막대 전체 길이 = (a+b)L, 줄은 물체 쪽 끝에서 aL.
     무게중심은 줄에서 (b-a)/2 L 떨어진 반대쪽.
     M·a = W·(b-a)/2  →  W = 2Ma/(b-a)                       */
  function genProblem() {
    for (let t = 0; t < 2000; t++) {
      const a = ri(1, 3), b = ri(a + 1, 6);
      if (a + b > 7) continue;
      const M = 5 * ri(1, 10);
      const W = 2 * M * a / (b - a);
      if (!Number.isInteger(W) || W < 5 || W > 100) continue;
      const mirror = Math.random() < 0.5;
      const key = [a, b, M, mirror].join();
      if (key === state.lastKey) continue;
      return { a, b, M, W, mirror, key };
    }
    return { a: 1, b: 3, M: 20, W: 20, mirror: false, key: '1,3,20,false' };
  }

  /* ---------- 보기 생성 (흔한 실수를 오답으로) ---------- */
  function buildOptions(p) {
    const { a, b, M, W } = p;
    const ok = v => Number.isFinite(v) && v > 0 && Math.abs(v * 2 - Math.round(v * 2)) < 1e-9 && Math.abs(v - W) > 1e-9;
    const reasoned = [
      { v: M * a / b,       why: '막대의 무게가 막대 끝에 작용한다고 계산한 경우예요. 균일한 막대의 무게는 정중앙에 작용해요.' },
      { v: M * a / (b - a), why: '무게중심까지의 거리를 ' + Ln(b - a) + '의 절반(' + Ln((b - a) / 2) + ')이 아니라 ' + Ln(b - a) + '로 계산한 경우예요.' },
      { v: M * b / a,       why: '물체와 막대의 팔 길이를 서로 바꿔 넣은 경우예요.' },
      { v: M,               why: '두 무게가 같다고 보고 팔 길이를 비교하지 않은 경우예요.' }
    ];
    const fillers = [1.5 * W, 2 * W, W / 2, 3 * W, W + 10, W + 5].map(v => ({ v, why: '' }));
    const picked = [];
    const seen = new Set();
    for (const c of [...reasoned, ...fillers]) {
      if (picked.length >= 4) break;
      if (!ok(c.v) || seen.has(c.v)) continue;
      seen.add(c.v);
      picked.push(c);
    }
    const all = [...picked.map(c => ({ v: c.v, why: c.why, correct: false })), { v: W, why: '', correct: true }];
    all.sort((x, y) => x.v - y.v);
    return all;
  }

  /* ---------- 그림 ---------- */
  function figure(p) {
    const { a, b, M, mirror } = p;
    const d = (b - a) / 2;
    const X0 = 40, X1 = 320, u = (X1 - X0) / (a + b);
    const dir = mirror ? -1 : 1;                 // 물체 쪽 끝 → 먼 끝 방향
    const massEnd = mirror ? X1 : X0, farEnd = mirror ? X0 : X1;
    const pivot = massEnd + dir * a * u;
    const center = (X0 + X1) / 2;
    const hang = massEnd + dir * 8;
    const RY = 112, RH = 26, RM = RY + RH / 2, RB = RY + RH;

    const dim = (x1, x2, y, label, cls, below) => {
      const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
      const mk = cls === 'acc' ? 'ar2' : 'ar';
      return `<g class="dimg ${cls || ''}">
        <line x1="${lo}" y1="${y}" x2="${hi}" y2="${y}" marker-start="url(#${mk})" marker-end="url(#${mk})"/>
        <line x1="${lo}" y1="${y - 8}" x2="${lo}" y2="${y + 8}"/>
        <line x1="${hi}" y1="${y - 8}" x2="${hi}" y2="${y + 8}"/>
        <text x="${(lo + hi) / 2}" y="${below ? y + 24 : y - 9}" text-anchor="middle">${label}</text>
      </g>`;
    };

    const anchor = dir > 0 ? 'start' : 'end';

    return `<svg viewBox="0 0 360 268" role="img"
      aria-label="길이 ${a + b}L인 균일한 막대. 줄은 물체 쪽 끝에서 ${a}L 지점에 매달려 있고, 물체 ${M} N이 막대 끝에 걸려 있다.">
      <defs>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line class="hatch-l" x1="0" y1="0" x2="0" y2="7"/>
        </pattern>
        <linearGradient id="rodg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--rod-a)"/>
          <stop offset=".5" style="stop-color:var(--rod-b)"/>
          <stop offset="1" style="stop-color:var(--rod-c)"/>
        </linearGradient>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L10 5 L0 9 z" style="fill:var(--ink)"/>
        </marker>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L10 5 L0 9 z" style="fill:var(--accent)"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="360" height="15" fill="url(#hatch)"/>
      <line class="ceil" x1="0" y1="15" x2="360" y2="15"/>

      <line class="cord" x1="${pivot}" y1="15" x2="${pivot}" y2="${RY + 3}"/>
      <line class="cord" x1="${hang}" y1="${RM}" x2="${hang}" y2="178"/>

      <rect class="rod" x="${X0}" y="${RY}" width="${X1 - X0}" height="${RH}" rx="13" fill="url(#rodg)"/>
      <ellipse class="cap" cx="${farEnd - dir * 7}" cy="${RM}" rx="5" ry="9"/>
      <circle class="knot" cx="${pivot}" cy="${RY}" r="3.5"/>

      <rect class="blk" x="${hang - 28}" y="178" width="56" height="44" rx="3"/>
      <text class="blk-t" x="${hang}" y="206" text-anchor="middle">${M} N</text>

      <text class="wl" x="${farEnd + dir * 8}" y="${RM + 7}" text-anchor="${mirror ? 'end' : 'start'}">W</text>

      ${dim(massEnd, pivot, 92, Lx(a))}
      ${dim(pivot, farEnd, 92, Lx(b))}

      <g class="sol">
        <line class="guide" x1="${pivot}" y1="${RB}" x2="${pivot}" y2="238"/>
        <line class="guide" x1="${center}" y1="188" x2="${center}" y2="238"/>
        <line class="arrow" x1="${center}" y1="${RB}" x2="${center}" y2="188" marker-end="url(#ar2)"/>
        <circle class="dot" cx="${center}" cy="${RM}" r="4.5"/>
        <text class="wtxt" x="${center + dir * 10}" y="166" text-anchor="${anchor}">W<tspan dx="6">무게중심</tspan></text>
        ${dim(pivot, center, 238, Lx(d), 'acc', true)}
      </g>
    </svg>`;
  }

  /* ---------- 화면 그리기 ---------- */
  function render() {
    const p = state.p;
    $('stem').innerHTML =
      `그림과 같이 무게가 <strong>${p.M} N</strong>인 물체가 무게가 <i class="v">W</i>인 재질이 균일한 원통형 막대에 매달려서 막대가 수평 상태로 정지해 있다.`;
    $('fig').classList.remove('solved');
    $('fig').innerHTML = figure(p);

    $('opts').innerHTML = state.opts.map((o, i) =>
      `<li><button type="button" class="opt" role="radio" aria-checked="false" data-i="${i}">
         <span class="no">${CIRC[i]}</span><span class="val">${fmt(o.v)} N</span><span class="mark" aria-hidden="true"></span>
       </button></li>`).join('');

    $('result').hidden = true;
    $('result').className = 'card result';
    $('btn-check').disabled = true;
    $('btn-check').classList.add('solid');
    $('btn-new').classList.remove('solid');
  }

  function newProblem(first) {
    clearSkulls();
    state.p = first ? { a: 1, b: 3, M: 20, W: 20, mirror: false, key: '1,3,20,false' } : genProblem();
    state.lastKey = state.p.key;
    state.opts = buildOptions(state.p);
    state.sel = null;
    state.done = false;
    render();
    if (!first) window.scrollTo({ top: 0, behavior: (reduceMotion || INTRO.onNewProblem) ? 'auto' : 'smooth' });
  }

  /* ---------- 인트로: 사진이 먼저 뜨고 문제 화면으로 자연스럽게 넘어감 ---------- */
  const intro = $('intro');
  let introTimer = null, pendingSwap = null;

  function hideIntro() {
    clearTimeout(introTimer);
    if (pendingSwap) { pendingSwap(); pendingSwap = null; }
    intro.classList.remove('on');
  }
  function playIntro(swap) {
    clearTimeout(introTimer);
    intro.classList.add('on');
    pendingSwap = swap || null;
    // 새 문제일 때는 사진이 덮인 뒤에 문제를 바꿔서, 바뀌는 순간이 보이지 않게 함
    introTimer = setTimeout(() => {
      if (pendingSwap) { pendingSwap(); pendingSwap = null; }
      introTimer = setTimeout(hideIntro, INTRO.holdMs);
    }, swap && !reduceMotion ? 260 : 0);
  }
  intro.addEventListener('click', hideIntro);
  intro.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hideIntro(); }
  });

  function select(i) {
    if (state.done) return;
    state.sel = i;
    document.querySelectorAll('.opt').forEach((btn, k) => btn.setAttribute('aria-checked', k === i ? 'true' : 'false'));
    $('btn-check').disabled = false;
  }

  function check() {
    if (state.sel === null || state.done) return;
    state.done = true;
    state.tries++;
    const { a, b, M, W } = state.p;
    const d = (b - a) / 2;
    const chosen = state.opts[state.sel];
    const ci = state.opts.findIndex(o => o.correct);
    const isOk = chosen.correct;
    if (isOk) state.score++; else skullBang();
    $('score').textContent = state.score;
    $('tries').textContent = state.tries;

    document.querySelectorAll('.opt').forEach((btn, k) => {
      btn.disabled = true;
      if (k === ci) btn.classList.add('ok');
      else if (k === state.sel) btn.classList.add('bad');
    });

    const head = isOk
      ? '정답이에요'
      : `오답이에요. 정답은 ${CIRC[ci]} ${fmt(W)} N이에요`;
    const why = (!isOk && chosen.why) ? `<p class="why">${chosen.why}</p>` : '';

    const res = $('result');
    res.className = 'card result ' + (isOk ? 'ok' : 'bad');
    res.innerHTML = `
      <h2>${head}</h2>
      ${why}
      <ol>
        <li>막대는 길이가 ${Ln(a + b)}인 균일한 막대예요. 막대의 무게 <i class="v">W</i>는 정중앙, 즉 물체 쪽 끝에서 ${Ln((a + b) / 2)} 떨어진 곳에 작용해요.</li>
        <li>줄은 물체 쪽 끝에서 ${Ln(a)} 떨어져 있어요. 줄에서 무게중심까지의 거리는 ${Ln((a + b) / 2)} − ${Ln(a)} = <strong>${Ln(d)}</strong>이고, 물체의 반대쪽이에요.</li>
        <li>줄이 매달린 점을 회전축으로 잡으면 줄의 장력은 돌림힘을 만들지 않아요. 두 돌림힘이 평형이므로<br>
          <span class="eq">${M} N × ${Ln(a)} = <i class="v">W</i> × ${Ln(d)}</span></li>
        <li><span class="eq"><i class="v">W</i> = ${M} × ${fmt(a)} ÷ ${fmt(d)} = <strong>${fmt(W)} N</strong></span></li>
      </ol>
      <p class="note">참고: 힘의 평형에서 줄의 장력은 T = ${M} + ${fmt(W)} = ${fmt(M + W)} N이에요.</p>`;
    res.hidden = false;

    $('fig').classList.add('solved');
    $('btn-check').disabled = true;
    $('btn-check').classList.remove('solid');
    $('btn-new').classList.add('solid');
    res.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  $('opts').addEventListener('click', e => {
    const btn = e.target.closest('.opt');
    if (btn) select(Number(btn.dataset.i));
  });
  $('btn-check').addEventListener('click', check);
  $('btn-new').addEventListener('click', () => {
    if (INTRO.onNewProblem) playIntro(() => newProblem(false));
    else newProblem(false);
  });

  newProblem(true);   // 첫 문제는 원본 문제(20 N, L : 3L)
  if (INTRO.onStart) playIntro(null);
  else intro.classList.remove('on');
})();
</script>
</body>
</html>
