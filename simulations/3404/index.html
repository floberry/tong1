<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돌림힘 평형 연습 시뮬레이션</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--sub:#5b6577;--pri:#2f6fed;--ok:#1a9a5b;--no:#d6453d;--line:#d9dfeb;--rod:#8a5a2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--tx:#e8ecf4;--sub:#9aa6bb;--pri:#6b9bff;--ok:#43c68a;--no:#ff7a70;--line:#2c3547;--rod:#c28a52}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--tx:#e8ecf4;--sub:#9aa6bb;--pri:#6b9bff;--ok:#43c68a;--no:#ff7a70;--line:#2c3547;--rod:#c28a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:14px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;font-size:22px;opacity:0;animation:fl 1.8s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.3)}}
.paw{position:absolute;font-size:36px;animation:kn .45s ease-in-out 4}
@keyframes kn{0%,100%{transform:translateY(-10px) scale(1.1)}50%{transform:translateY(8px) scale(.8)}}
.bub{position:absolute;background:var(--card);color:var(--tx);border:2px solid var(--tx);border-radius:14px;padding:4px 10px;font-weight:800;font-size:14px;animation:pop .35s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.scr{position:absolute;inset:0;width:100%;height:100%}
.scr path{fill:none;stroke:#e5333a;stroke-width:5;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:dr .35s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
h1{font-size:19px;margin:4px 0 2px}.sub{color:var(--sub);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
svg{width:100%;height:auto;display:block}
.box{border:1.5px solid var(--tx);border-radius:8px;padding:10px 12px;margin:10px 0}
.box p{margin:6px 0;font-size:15px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:8px}
input[type=range]{width:100%;accent-color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.opt{padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;text-align:center;cursor:pointer}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,transparent);font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:var(--pri)}
button.b.g{background:var(--sub)}
#fb{display:none}
.res{font-size:17px;font-weight:800;margin:0 0 6px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.step{font-size:14px;margin:8px 0}.step b{color:var(--pri)}
.v{font-size:14px;margin:4px 0}.v i{font-style:normal;font-weight:800}
.t{color:var(--ok)}.f{color:var(--no)}
</style></head><body><main>
<h1>⚖️ 막대 돌림힘 평형 연습</h1>
<p class="sub">고양이가 막대 끝을 눌러 물통을 들고 있는 상황, 값을 바꿔 가며 연습해요.</p>
<div class="card">
<div class="top"><span id="no">문제 1</span><b id="lv"></b><span>🔥 연속 <b id="st">0</b></span></div><div class="top" style="margin-top:4px;font-size:15px"><span id="lives"></span><span>⭐ <b id="sc">0</b>점 (최고 <span id="bs">0</span>)</span></div>
<div id="fw" style="position:relative"><svg id="fig" viewBox="0 0 340 250" role="img" aria-label="막대와 물통 그림"></svg><div id="fx"></div></div>
<div class="ctl">
<label><span>손이 누르는 힘 F</span><b id="vF"></b></label><input id="sF" type="range" min="12" max="120" step="12">
<label><span>고양이 몸무게 W</span><b id="vW"></b></label><input id="sW" type="range" min="400" max="700" step="10">
<label><span>물통까지 거리 (손까지 거리 L 기준)</span><b id="vK"></b></label><input id="sK" type="range" min="0" max="3" step="1">
</div></div>

<div class="card">
<p style="margin:0;font-size:15px" id="q"></p>
<div class="box" id="bogi"></div>
<div class="opts" id="opts"></div>
<div class="row"><button class="b g" id="bn">새 문제</button><button class="b" id="bc">확인</button></div>
</div>
<div class="card" id="fb"></div>
</main>
<script>
const KS=[1.5,2,3,4], ORD=['ㄱ','ㄴ','ㄷ'];
const OPT=[['ㄱ'],['ㄴ'],['ㄱ','ㄴ'],['ㄴ','ㄷ'],['ㄱ','ㄴ','ㄷ']];
const CI=['①','②','③','④','⑤'];
let S={}, sel=-1, done=false, n=1, streak=0, lives=3, score=0, best=0;
function hud(){$('lives').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);$('sc').textContent=score;$('bs').textContent=best;$('st').textContent=streak;
$('lv').textContent=score>=200?'👑 물리 대장 냥':score>=100?'😼 돌림힘 고수':score>=40?'🐱 수습 냥':'🐾 아기 고양이'}
function fx(ok){const f=$('fx');f.innerHTML='';
 if(ok){f.innerHTML='<span class="paw" style="left:50%;top:52%">🐾</span><span class="paw" style="left:62%;top:52%;animation-delay:.22s">🐾</span><span class="bub" style="left:52%;top:3%">냥~ 꾹꾹 💕</span>';
  for(let i=0;i<9;i++){const h=document.createElement('span');h.className='heart';h.textContent=Math.random()<.5?'❤️':'💖';h.style.left=(42+Math.random()*34)+'%';h.style.top=(40+Math.random()*20)+'%';h.style.animationDelay=(Math.random()*.9)+'s';f.appendChild(h)}}
 else{f.innerHTML='<svg class="scr" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M45,10 L75,70"/><path d="M55,8 L85,68" style="animation-delay:.12s"/><path d="M65,6 L95,66" style="animation-delay:.24s"/></svg><span class="bub" style="left:50%;top:3%">하악! 😾</span>';
  const w=$('fw');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
 setTimeout(()=>f.innerHTML='',2400)}
const $=id=>document.getElementById(id);
const r=(a,b,s)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const kt=k=>k+'L';
function wb(){return S.F/S.k}
function newQ(){
  S.F=r(12,120,12);S.W=r(400,700,10);S.k=KS[Math.floor(Math.random()*4)];
  S.truth=OPT[Math.floor(Math.random()*5)];
  S.bad={a:Math.random()<.5,b:Math.random()<.5,c:Math.random()<.5};
  sel=-1;done=false;$('fb').style.display='none';$('no').textContent='문제 '+n;
  sync();hud();
}
function sync(){
  $('sF').value=S.F;$('sW').value=S.W;$('sK').value=KS.indexOf(S.k);
  $('vF').textContent=S.F+' N';$('vW').textContent=S.W+' N';$('vK').textContent=kt(S.k);
  draw();stmts();opts();
  if(done){done=false;$('fb').style.display='none'}
}
function fmt(x){return Number.isInteger(x)?x:+x.toFixed(1)}
function stmts(){
  const w=wb(),F=S.F,W=S.W,t=S.truth,B=S.bad;
  const wrongA=fmt(w), wrongB=B.b?fmt(F*S.k):F, wrongC=B.c?W+F:fmt(W+F+w);
  S.txt={
    'ㄱ':t.includes('ㄱ')?'물통에 작용하는 알짜힘은 0이다.':'물통에 작용하는 알짜힘은 '+wrongA+' N이다.',
    'ㄴ':'물통의 무게는 '+(t.includes('ㄴ')?fmt(w):wrongB)+' N이다.',
    'ㄷ':'고양이가 지면을 누르는 힘의 크기는 '+(t.includes('ㄷ')?fmt(W+w):wrongC)+' N이다.'};
  $('q').textContent='막대의 질량은 무시한다. 막대가 수평으로 정지해 있을 때, 옳은 설명만을 <보기>에서 있는 대로 고른 것은? (W='+W+' N, F='+F+' N, 물통까지 '+kt(S.k)+')';
  $('bogi').innerHTML='<b>&lt;보기&gt;</b>'+ORD.map(o=>'<p>'+o+'. '+S.txt[o]+'</p>').join('');
}
function opts(){
  $('opts').innerHTML=OPT.map((o,i)=>'<div class="opt'+(sel==i?' sel':'')+'" data-i="'+i+'">'+CI[i]+' '+o.join(', ')+'</div>').join('');
  document.querySelectorAll('.opt').forEach(e=>e.onclick=()=>{if(done)return;sel=+e.dataset.i;opts()});
}
function draw(){
  const k=S.k,hx=250,sx=210,bx=sx-(hx-sx)*k,px=Math.max(bx,28);
  const unit=(hx-sx), bxx=Math.max(20,sx-unit*k);
  $('fig').innerHTML=`
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--no)"/></marker></defs>
  <rect x="${bxx-6}" y="78" width="${hx-bxx+22}" height="6" rx="3" fill="var(--rod)"/>
  <line x1="${bxx}" y1="84" x2="${bxx}" y2="108" stroke="var(--sub)" stroke-width="2"/>
  <path d="M${bxx-22},108 h44 l-6,34 h-32z" fill="none" stroke="var(--tx)" stroke-width="2.5"/>
  <text x="${bxx}" y="130" font-size="11" text-anchor="middle" fill="var(--tx)">물통</text>
  <g stroke="#2b3a4d" stroke-width="1.5" stroke-linejoin="round">
  <rect x="${sx-9}" y="160" width="7" height="60" rx="2" fill="#a9cdee"/><rect x="${sx+2}" y="160" width="7" height="60" rx="2" fill="#a9cdee"/>
  <rect x="${sx-9}" y="206" width="7" height="14" rx="2" fill="#fff"/><rect x="${sx+2}" y="206" width="7" height="14" rx="2" fill="#fff"/>
  <rect x="${sx-13}" y="70" width="26" height="92" rx="4" fill="#a9cdee"/>
  <rect x="${sx-21}" y="86" width="6" height="30" rx="3" fill="#a9cdee"/><rect x="${sx-21}" y="108" width="6" height="10" rx="3" fill="#fff"/>
  <path d="M${sx+10},88 L${hx},79" stroke="#a9cdee" stroke-width="7" stroke-linecap="round"/><circle cx="${hx}" cy="79" r="4.5" fill="#fff"/>
  <polygon points="${sx-23},38 ${sx-21},12 ${sx-5},29" fill="#a9cdee"/><polygon points="${sx+23},38 ${sx+21},12 ${sx+5},29" fill="#a9cdee"/>
  <polygon points="${sx-20},34 ${sx-19},19 ${sx-10},29" fill="#f2d3a0" stroke="none"/><polygon points="${sx+20},34 ${sx+19},19 ${sx+10},29" fill="#f2d3a0" stroke="none"/>
  <rect x="${sx-23}" y="26" width="46" height="40" rx="16" fill="#a9cdee"/>
  <path d="M${sx-4},27 L${sx+4},27 L${sx+5},46 Q${sx},52 ${sx-5},46z" fill="#fff" stroke="none"/>
  <ellipse cx="${sx}" cy="58" rx="15" ry="8" fill="#fff" stroke="none"/>
  <ellipse cx="${sx-11}" cy="44" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="${sx+11}" cy="44" rx="7.5" ry="8.5" fill="#fff"/>
  <ellipse cx="${sx-10}" cy="45" rx="3" ry="5" fill="#222" stroke="none"/><ellipse cx="${sx+10}" cy="45" rx="3" ry="5" fill="#222" stroke="none"/>
  <path d="M${sx-4},57 q2,3 4,0 q2,3 4,0" fill="none"/>
  <rect x="${sx-14}" y="66" width="28" height="5" rx="2" fill="#8b5a4a"/></g>
  <line x1="20" y1="226" x2="320" y2="226" stroke="var(--tx)" stroke-width="3"/>
  <text x="300" y="243" font-size="11" fill="var(--sub)">지면</text>
  <line x1="${hx}" y1="38" x2="${hx}" y2="74" stroke="var(--no)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="${hx+6}" y="44" font-size="13" font-weight="700" fill="var(--no)">F=${S.F}N</text>
  <line x1="${sx+34}" y1="150" x2="${sx+34}" y2="190" stroke="var(--pri)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="${sx+40}" y="172" font-size="13" font-weight="700" fill="var(--pri)">W=${S.W}N</text>
  <path d="M${bxx},70 H${sx}" stroke="var(--sub)" stroke-dasharray="3 3"/><text x="${(bxx+sx)/2}" y="64" font-size="13" text-anchor="middle" fill="var(--tx)" font-style="italic">${kt(k)}</text>
  <path d="M${sx},70 H${hx}" stroke="var(--sub)" stroke-dasharray="3 3"/><text x="${(sx+hx)/2}" y="64" font-size="13" text-anchor="middle" fill="var(--tx)" font-style="italic">L</text>
  <circle cx="${sx}" cy="81" r="4" fill="var(--pri)"/>`;
}
function check(){
  if(lives<=0){alert('게임 오버! 새 문제를 눌러 다시 시작하세요');return}
  if(sel<0){alert('보기를 선택해 주세요');return}
  done=true;
  const ans=OPT[sel],ok=ans.join()===S.truth.join();
  const w=fmt(wb()),F=S.F,W=S.W,k=S.k;
  let gain=0;if(ok){streak++;gain=10+Math.min(streak-1,5)*2;score+=gain;best=Math.max(best,score)}else{streak=0;lives--}hud();
  const v=ORD.map(o=>{const t=S.truth.includes(o);return '<div class="v"><i class="'+(t?'t':'f')+'">'+o+' '+(t?'○ 옳음':'× 틀림')+'</i> — '+S.txt[o]+'</div>'}).join('');
  const correctIdx=OPT.findIndex(o=>o.join()===S.truth.join());
  $('fb').style.display='block';
  $('fb').innerHTML=`<p class="res ${ok?'ok':'no'}">${ok?'😻 정답이냥! +'+gain+'점':'😾 틀렸냥! 하트 -1'} (정답: ${CI[correctIdx]} ${S.truth.join(', ')})</p>${v}
  <hr style="border:0;border-top:1px solid var(--line)">
  <div class="step"><b>① 물통 (ㄱ)</b><br>물통은 정지해 있으므로 <b>알짜힘 = 0</b>입니다. 줄이 당기는 힘과 중력이 같아요 → 줄의 장력 = 물통의 무게.</div>
  <div class="step"><b>② 막대의 돌림힘 평형 (ㄴ)</b><br>막대가 수평으로 정지 → 어깨(받침점) 기준 돌림힘의 합 = 0.<br>
  (물통 무게 × 거리) = (손의 힘 × 거리)<br>
  w × ${kt(k)} = ${F} N × L &nbsp;⇒&nbsp; w = ${F}/${k} = <b>${w} N</b> (일반식: w = F/${k})<br>
  <small style="color:var(--sub)">※ 막대 질량 무시, 어깨가 받치는 힘은 회전축에 작용해 돌림힘이 0이에요.</small></div>
  <div class="step"><b>③ 어깨가 막대를 받치는 힘</b><br>막대 전체 힘의 평형: N(위) = w + F = ${w} + ${F} = <b>${fmt(w+F)} N</b>. 작용·반작용으로 막대는 어깨를 같은 크기로 아래로 누릅니다.</div>
  <div class="step"><b>④ 고양이가 지면을 누르는 힘 (ㄷ)</b><br>고양이에게 작용하는 힘: 몸무게 W(↓), 어깨가 받는 힘 ${fmt(w+F)} N(↓), 손이 받는 힘 F=${F} N(↑).<br>
  지면의 수직항력 = W + ${fmt(w+F)} − ${F} = W + w = ${W} + ${w} = <b>${fmt(W+w)} N</b><br>
  지면이 고양이를 떠받치는 힘과 고양이가 지면을 누르는 힘은 작용·반작용 관계이므로 크기가 같아요. 즉 <b>W + (물통의 무게)</b>이고, 막대에 손으로 준 힘 F 전체를 더하는 것이 아니에요. (원 문제: w=F/2 이면 W + F/2)</div>`;
  if(lives<=0)$('fb').innerHTML+='<p class="res no">💀 게임 오버! 최종 '+score+'점 (최고 '+best+'점) — 새 문제를 누르면 다시 시작해요.</p>';fx(ok);setTimeout(()=>$('fb').scrollIntoView({behavior:'smooth',block:'start'}),1900);
}
$('bn').onclick=()=>{if(lives<=0){lives=3;score=0;streak=0;n=0}n++;newQ();window.scrollTo({top:0,behavior:'smooth'})};
$('bc').onclick=()=>{if(!done)check()};
$('sF').oninput=e=>{S.F=+e.target.value;sync()};
$('sW').oninput=e=>{S.W=+e.target.value;sync()};
$('sK').oninput=e=>{S.k=KS[+e.target.value];sync()};
newQ();
</script></body></html>
